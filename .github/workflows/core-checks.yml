name: Core Csharp validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Execute numerical and behavioural checks
        run: dotnet run --project Tools/CoreHarness -- check --root .
      - name: Check repository structure
        run: python3 Tools/validate_repository.py
# This workflow does not activate Unity, build a Player, or publish a release.

